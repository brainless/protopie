[package]
name = "protopie-server"
version = "0.1.0"
edition = "2021"

[dependencies]
protopie-api = { workspace = true }
protopie-ui-agent = { path = "../protopie-ui-agent" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }
tempfile = "3"
